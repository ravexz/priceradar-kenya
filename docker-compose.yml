services:
  postgres:
    image: postgres:15-alpine
    container_name: priceradar_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: priceradar_kenya
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d priceradar_kenya"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: priceradar_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: priceradar_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/priceradar_kenya?schema=public"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_URL: "redis://redis:6379"
      PORT: "4000"
      NODE_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push && npx ts-node -O '{\"module\":\"CommonJS\"}' prisma/seed.ts && npx ts-node -O '{\"module\":\"CommonJS\"}' src/server.ts"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: priceradar_worker
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/priceradar_kenya?schema=public"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["npx", "ts-node", "-O", "{\"module\":\"CommonJS\"}", "src/worker.ts"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: priceradar_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/priceradar_kenya?schema=public"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_CURRENCY: "KES"
      NEXT_PUBLIC_CURRENCY_SYMBOL: "KSh"
      NODE_ENV: "production"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
